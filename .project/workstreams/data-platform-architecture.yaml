schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "creator-scale-ingestion-pilot"

current_gate: >
  Validate Agent Contract v1 against a bounded Aaron & Claire creator/channel
  cohort. The ingestion contract itself has already passed isolated-source and
  heterogeneous six-source batch validation; the remaining proof point is whether
  the role boundaries, escalation rules, idempotency expectations, and deterministic
  promotion model remain reliable at creator scale.

current_state: >
  Ingestion contract v1 and Agent Contract v1 are both documented. The Aaron &
  Claire creator-scale pilot has now completed the Discovery stage. Supabase was
  restored from a paused state on 2026-09-19 and is ACTIVE_HEALTHY. A bounded
  10-video cohort is staged in recipe_inbox: one previously verified Ssamjang
  source is reused as a control and nine newly discovered YouTube sources were
  inserted with review_policy=explicit_review, content_resolution_status=pending,
  and pilot metadata that preserves creator identity, cohort order, expected
  recipe-count hints, and the existing Aaron and Claire channel-review collection
  reference. The live database is freshly verified at 246 recipes, 142 sources,
  200 inbox items, 14 candidates, 17 evidence rows, and 52 culinary concepts.
  Autonomous agent workers are not implemented yet; this specialist chat is
  executing the pilot according to the Agent Contract boundaries so that each
  future role can be evaluated from observed behavior.

exact_next_action: >
  Execute the Resolver stage for the nine new Aaron & Claire pilot sources.
  Resolve YouTube metadata and descriptions first, follow creator-owned written
  recipe pages where available, persist evidence with correct source_content vs
  creator_reference roles, and leave any access limitations explicit. Do not
  classify or promote recipes until resolver evidence is assembled for the pilot
  sources. The existing Ssamjang control remains completed and should be used for
  comparison rather than reprocessed destructively.

blockers:
  - "No known architecture blocker for starting the Aaron & Claire pilot."
  - >
      Direct YouTube fetch remains inconsistent, but partial-resolution and
      external_reference fallback semantics are already part of the validated
      ingestion contract.
  - "No current Supabase availability blocker; the project is ACTIVE_HEALTHY after restore on 2026-09-19."

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      Creator-scale quality depends on legitimately accessible metadata/content,
      creator-written references, or trustworthy external references. Failed or
      partial acquisition must remain explicit and must never be replaced with
      invented source content.
  - project: "Project OS / Agent Architecture"
    workstream: "Cross-project agent platform"
    dependency: >
      Recipe Intelligence owns the domain-specific Agent Contract. Project OS/Core
      may later decide how these roles are hosted, scheduled, observed, and reused
      across projects, but that platform decision is not required to run the
      supervised pilot.

important_open_loops:
  - "Resolve evidence for the nine newly staged Aaron & Claire pilot sources."
  - >
      Measure which Agent Contract roles are genuinely mechanical vs which require
      strong reasoning or human review.
  - >
      Decide whether a normalized Creator entity is warranted after repeated
      creator processing; current source/content-collection provenance remains
      sufficient until evidence says otherwise.
  - >
      Decide whether specific culinary-concept creation can later be delegated
      safely or should remain explicit-review during early agent operation.
  - >
      Continue using culinary concepts for specific ingredient retrieval while
      keeping protein and main_ingredient coarse and purposeful.
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after creator-scale ingestion behavior is proven."

portfolio:
  milestone: true
  signal: >
    Recipe Intelligence now has both a validated ingestion data contract and a
    concrete agent-execution contract. The next proof point is no longer whether
    isolated ingestion works, but whether a bounded creator cohort can be processed
    repeatably with narrow agent permissions, auditable evidence, strong-reasoning
    QA only where needed, deterministic promotion, and explicit escalation instead
    of guessing.

stale_or_unknown:
  - >
      Creator-layer normalization remains intentionally undecided pending the
      first real creator/channel pilot.
  - >
      The concrete runtime/orchestration technology for autonomous agents is not
      selected or implemented; Agent Contract v1 is the domain behavior contract,
      not the deployment architecture.

verification:
  last_verified: "2026-09-19"
  sources:
    - "Live Supabase restored and verified ACTIVE_HEALTHY on 2026-09-19."
    - "Fresh live counts after Discovery staging: 246 recipes, 142 sources, 200 inbox items, 14 candidates, 17 evidence rows, 52 culinary concepts."
    - "Aaron & Claire Agent Contract v1 pilot cohort: 10 inbox rows total, 1 existing control, 9 new explicit-review discoveries."
    - "docs/ingestion-contract-v1.md on repository main, previously validated against live ingestion cases."
    - "docs/agent-contract-v1.md created for the Aaron & Claire creator-scale pilot."
    - "Repository AGENTS.md uses risk-based Git workflow and permits automatic merge after approved scope and checks."
    - "Attempted live Supabase count refresh on 2026-09-19 failed due to connection timeout; prior 2026-09-10 counts retained as stale snapshot."
    - "Agent Contract v1 merged to main via PR #8, squash commit f5632cf0311528b2bfbec1538d25b640fc3fb39c."

sync:
  status: "synced"
  storage: ".project/workstreams/data-platform-architecture.yaml"
