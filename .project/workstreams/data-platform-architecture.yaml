schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "creator-scale-ingestion-pilot"

current_gate: >
  Validate Agent Contract v1 against a bounded Aaron & Claire creator/channel
  cohort. Discovery, Resolver, Classification, and QA/Review have now completed
  successfully for the first 10-video cohort. The remaining gate is explicit
  human review followed by deterministic promotion/merge and a post-pilot
  agent-readiness audit.

current_state: >
  Supabase is ACTIVE_HEALTHY after restore on 2026-09-19. The Aaron & Claire
  Agent Contract v1 pilot contains 10 sources: one previously verified Ssamjang
  control plus nine newly discovered YouTube sources. Resolver produced auditable
  evidence for all nine new sources: eight are resolved through YouTube source
  content plus creator-owned recipe references, while one 2024 Gochujang Noodles
  source remains truthfully partial because its exact creator page could not be
  independently verified. Classification produced 25 new recipe candidates
  without writing to recipes. QA/Review then validated the cohort against live
  recipes and preferences: 24 candidates passed validation, 20 are proposed
  unique/meaningful variants, 4 are exact duplicates proposed for enrichment/
  merge, and 1 partial-source Gochujang Noodles candidate remains a possible
  duplicate requiring review. All nine new inbox sources are ready_for_review.
  No promotion has occurred. Fresh live counts are 246 recipes, 142 sources,
  200 inbox items, 39 candidates, 40 evidence rows, and 52 culinary concepts.
  Agent Contract v1 therefore has now exercised four of its five roles in a real
  creator cohort: Discovery, Resolver, Classification, and QA/Review. Promotion
  Executor remains intentionally gated on explicit review.

exact_next_action: >
  Review the Aaron & Claire QA dispositions with Igor. Approve/reject the 20
  proposed unique candidates and the 4 exact-duplicate enrichment actions, while
  keeping the unresolved 2024 Gochujang Noodles candidate on hold unless its
  identity can be resolved safely. After explicit approval, run the deterministic
  Promotion Executor only for approved dispositions, verify resulting recipes/
  sources/bridges/inbox states, then stop and perform the Agent Contract v1
  pilot audit before any broader channel crawl.

blockers:
  - "No current Supabase availability or architecture blocker."
  - >
      The 2024 Gochujang Noodles source is intentionally partial and may overlap
      the resolved 2022 Gochujang Noodles / Gochujang Stir-Fried Noodles recipe.
      It must not be promoted until identity is resolved or explicitly held.
  - >
      Promotion is intentionally blocked on explicit review because creator/
      channel discovery uses review_policy=explicit_review.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      Creator-scale quality depends on legitimately accessible metadata/content,
      creator-written references, or trustworthy external references. Failed or
      partial acquisition must remain explicit and must never be replaced with
      invented source content.
  - project: "Project OS / Agent Architecture"
    workstream: "Cross-project agent platform"
    dependency: >
      Recipe Intelligence owns the domain-specific Agent Contract. Project OS/Core
      may later decide how these roles are hosted, scheduled, observed, and reused
      across projects; that platform decision is not required for this supervised
      pilot.

important_open_loops:
  - "Complete explicit review of 25 new Aaron & Claire pilot candidates."
  - "Run deterministic Promotion Executor only for approved dispositions."
  - "Perform post-pilot Agent Contract v1 audit before expanding the channel crawl."
  - >
      Measure which roles proved mechanical vs which required strong reasoning or
      human review, including the partial-source Gochujang case.
  - >
      Decide whether a normalized Creator entity is warranted after this pilot;
      current source/content-collection provenance remains sufficient so far.
  - >
      Decide whether culinary-concept creation can later be delegated safely or
      should remain explicit-review during early agent operation.
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after creator-scale ingestion behavior is proven."

portfolio:
  milestone: true
  signal: >
    Recipe Intelligence has now exercised four distinct agent roles against a
    real creator-scale cohort with durable checkpoints and narrow writes. The
    system handled 1-to-many video extraction, existing-recipe dedupe, meaningful
    variants, preference checks, and a partial-source ambiguity without promoting
    unsupported data. The final proof point for Agent Contract v1 is deterministic
    execution of explicitly approved dispositions and the resulting audit.

stale_or_unknown:
  - >
      Creator-layer normalization remains intentionally undecided pending the
      post-pilot audit.
  - >
      The concrete runtime/orchestration technology for autonomous agents is not
      selected or implemented; Agent Contract v1 is the domain behavior contract,
      not the deployment architecture.
  - >
      Exact identity of the 2024 Gochujang Noodles source remains unresolved.

verification:
  last_verified: "2026-09-19"
  sources:
    - "Live Supabase ACTIVE_HEALTHY after project restore."
    - "Fresh live counts: 246 recipes, 142 sources, 200 inbox items, 39 candidates, 40 evidence rows, 52 culinary concepts."
    - "Aaron & Claire cohort: 10 sources total; 1 completed control + 9 new ready_for_review sources."
    - "Resolver: 8 new sources resolved, 1 new source partial with explicit resolution_error."
    - "Classification: 25 new extracted candidates; no recipe promotion."
    - "QA: 24 passed validation, 20 proposed unique, 4 exact duplicates, 1 possible duplicate/needs_review."
    - "docs/agent-contract-v1.md merged to main via PR #8."

sync:
  status: "synced"
  storage: ".project/workstreams/data-platform-architecture.yaml"
