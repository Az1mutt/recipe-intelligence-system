schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "creator-scale-ingestion-pilot"

current_gate: >
  Prove that ingestion contract v1 remains reliable when applied across a
  bounded creator/channel cohort rather than isolated URLs. The heterogeneous
  six-source Hárok3 batch gate is closed successfully: direct pages, duplicate
  enrichment, meaningful variants, non-recipe content, partial-source fallback,
  and merge semantics all behaved as intended.

current_state: >
  The live Supabase/PostgreSQL architecture has 33 public tables and currently
  contains 246 recipes, 142 sources, 191 recipe_inbox items, 14 recipe_candidates,
  17 recipe_inbox_evidence rows, and 52 culinary concepts. Ingestion contract v1
  is implemented and has now passed both single-source acceptance tests and a
  heterogeneous six-source batch. The completed batch produced: one exact
  duplicate enrichment (Perfect Pot Roast -> Pot Roast), one non-recipe article
  with zero recipe candidates (cheesecake water-bath technique), three unique
  recipe promotions (Japanese-Style Mapo Tofu, Creamy Spinach and Mushroom
  Gnocchi, Creamy Sausage Gnocchi), and one merge candidate where partial Tasty
  YouTube evidence safely enriched existing Pasta primavera without inventing
  unsupported details. The Tasty source remains truthfully partial and its
  third-party fallback remains external_reference evidence only. Ingredient-level
  retrieval semantics were refined during review: protein keeps the known meat
  species, main_ingredient remains a practical pantry/meal-planning dimension,
  and specific ingredients or forms such as Mleté mäso, Italian Sausage, or
  future Guanciale belong in culinary concepts rather than recipe tags. All 33
  public tables have RLS enabled, recipe_public_view remains the secure read
  surface, and the latest Supabase Security Advisor check reports zero lints.
  Stable repository documentation for the ingestion contract and live database
  state was refreshed and merged to main in PR #7 on 2026-09-10.

exact_next_action: >
  Run a bounded creator/channel-scale pilot using Aaron & Claire as the first
  creator cohort. First enumerate and stage a manageable set of channel videos
  with creator identity and source grouping preserved, then resolve candidates
  through the same evidence -> validation -> dedupe -> preference -> explicit-
  review pipeline. Do not bulk auto-promote the channel; use the pilot to validate
  repeated-source handling, creator grouping, batch review quality, and whether
  a normalized Creator entity or stronger agent orchestration is actually needed.

blockers:
  - "No current technical blocker in Supabase."
  - >
      Direct YouTube fetch remains inconsistent, but this is now a proven
      resolver constraint rather than a blocker because partial resolution and
      external_reference fallback semantics survived batch validation.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      Creator-scale quality depends on legitimately accessible metadata/content,
      creator-written references, or trustworthy external references. Failed or
      partial acquisition must remain explicit and must never be replaced with
      invented source content.

important_open_loops:
  - "Run the first bounded Aaron & Claire creator/channel-scale ingestion pilot."
  - >
      Use the pilot to define an Agent Contract v1: which steps can be delegated
      to discovery/resolver/classification/QA/promotion agents, what each agent
      may write, and which ambiguous decisions must escalate to this specialist
      chat or the user.
  - >
      Decide whether a normalized Creator entity is warranted after the pilot;
      for now creator identity remains on sources.author and source grouping is
      sufficient for provenance.
  - >
      Reuse the existing Aaron & Claire channel-review content collection for
      creator-scale review; do not use recipe tags for provenance.
  - >
      Continue using culinary concepts for specific ingredient retrieval while
      keeping protein and main_ingredient coarse and purposeful.
  - >
      Treat prep_time, cook_time, servings and similar fields as optional
      enrichment populated only when reliably supported by evidence.
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after creator-scale ingestion behavior is proven."

portfolio:
  milestone: true
  signal: >
    The project has crossed from schema and single-case validation into a proven
    heterogeneous ingestion pipeline. It now demonstrates auditable provenance,
    partial-source truthfulness, non-recipe rejection, duplicate enrichment,
    meaningful variant preservation, safe merge behavior, personal preference
    handling, and ingredient-level knowledge modeling under RLS. The next
    portfolio-relevant proof point is creator/channel-scale operation and a
    repeatable agent contract for delegated ingestion.

stale_or_unknown:
  - >
      Root project rollup is owned by Project OS and is not written by this
      specialist workstream; it may lag until the rollup owner reconciles this
      phase change.
  - >
      Creator-layer normalization remains intentionally undecided pending the
      first real creator/channel pilot.
  - >
      Repository-level AGENTS.md still contains the older conservative no-auto-
      merge workflow until the Project OS/Core rules are rewritten across repos.
      User explicitly approved automatic merge for verified stable changes in
      this workstream on 2026-09-10.

