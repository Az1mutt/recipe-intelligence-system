schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "batch-ingestion-validation"

current_gate: >
  Complete review of the staged heterogeneous Hárok3 validation batch and prove
  that ingestion contract v1 behaves correctly across direct recipe pages,
  duplicate/enrichment cases, meaningful variants, non-recipe content, and
  partial-source fallback before any creator/channel-scale crawl.

current_state: >
  The live Supabase/PostgreSQL architecture has 33 public tables and currently
  contains 245 recipes, 140 sources, 191 recipe_inbox items, 14 recipe_candidates,
  17 recipe_inbox_evidence rows, and 51 culinary concepts. A six-source Hárok3
  validation batch is in explicit review. Four sources are now dispositioned:
  Perfect Pot Roast was correctly treated as an exact duplicate and enriched the
  existing Pot Roast recipe; the cheesecake water-bath article resolved as
  technique content with zero recipe candidates; Japanese-Style Mapo Tofu
  (Mabo Dofu) was retained as a meaningful Japanese variant with the culinary
  concept "Mleté mäso" while keeping protein as Bravčové mäso; and Creamy
  Spinach and Mushroom Gnocchi was promoted as a unique American-Italian recipe
  with Gnocchi as main_ingredient, Restované as the closest preparation type,
  and no freezer tag because the source explicitly advises against freezing the
  cream-based sauce. The Tasty YouTube source remains truthfully partial and has
  already exercised the external_reference evidence role. Two recipe candidates
  remain in explicit review: Creamy Sausage Gnocchi and One-Pot Pasta Primavera.
  Supabase Security Advisor currently reports zero lints. Repository
  documentation outside Project State remains materially stale relative to the
  live architecture and will be refreshed when this batch gate closes.

exact_next_action: >
  Continue explicit review with Creamy Sausage Gnocchi, then review One-Pot
  Pasta Primavera. For each item, decide promote vs merge vs reject, preserve
  dedupe and provenance semantics, finish the six-source batch, review batch-level
  failure patterns, and decide whether the technical ingestion layer is ready
  for creator-scale crawling.

blockers:
  - "No current technical blocker in Supabase."
  - >
      Direct YouTube fetch is not consistently reliable, but this is a known
      resolver constraint rather than a blocker because source_content,
      creator_reference, and external_reference fallback semantics are working.
  - >
      Broad creator/channel crawling is intentionally gated until the current
      representative batch is fully reviewed and closed.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      High-quality classification depends on legitimately accessible source
      metadata/content, creator-written references, or trustworthy external
      references. Access failures must remain explicit rather than being filled
      with invented content.

important_open_loops:
  - "Finish review of Creamy Sausage Gnocchi and One-Pot Pasta Primavera."
  - "Evaluate batch-level failure modes and decide readiness for creator/channel-scale crawling."
  - >
      Decide whether a normalized Creator entity is warranted after repeated
      channel processing; shared-video provenance already works through the
      common source relation.
  - >
      Codify protein vs main_ingredient semantics and the Mleté mäso concept rule
      in technical/agent documentation when the current batch gate closes.
  - >
      Treat prep_time, cook_time, servings and similar fields as optional
      enrichment populated only when reliably supported by evidence.
  - "Refresh README/schema/current-state documentation after the batch-ingestion gate."
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after ingestion robustness is proven."

portfolio:
  milestone: true
  signal: >
    The project now demonstrates not only happy-path ingestion but real batch
    behavior: duplicate enrichment, meaningful variant preservation, non-recipe
    rejection, external-reference fallback with provenance separation, and
    practical taxonomy evolution without forcing bad values into the model.

stale_or_unknown:
  - >
      README and broader schema/current-state documentation are stale relative
      to the live 33-table architecture and ingestion-contract implementation.
  - >
      Creator-layer normalization remains intentionally undecided pending more
      real batch/channel evidence.

verification:
  last_verified: "2026-09-10"
  sources:
    - "Live Supabase verification: 33 public tables, 245 recipes, 140 sources, 191 inbox items, 14 candidates, 17 evidence rows, 51 culinary concepts."
    - "Live Supabase Security Advisor: 0 lints."
    - "Current six-source Hárok3 batch: 4 sources dispositioned, 2 recipe candidates still in explicit review."
    - "Creamy Spinach and Mushroom Gnocchi promoted as unique; Restované retained; no freezer tag."
    - "Tasty YouTube fallback verified with external_reference evidence role while source resolution remains partial."

sync:
  status: "synced"
  storage: ".project/workstreams/data-platform-architecture.yaml"
