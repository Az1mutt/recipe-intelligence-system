    - "Fresh live counts after first pilot promotion: 248 recipes, 145 sources, 200 inbox items, 39 candidates, 40 evidence rows, 52 culinary concepts."
    - "Aaron & Claire cohort: 10 sources total; 1 completed control + 9 new explicit-review sources."
    - "Resolver: 8 new sources resolved, 1 new source partial with explicit resolution_error."
    - "Classification/QA: 25 new candidates staged; one deliberate partial-source hold."
    - "Cohort item 2 approved/promoted: Ground Beef Bulgogi and Spicy Ground Pork Bulgogi; both linked to YouTube + creator pages and Mleté mäso concept."
    - "Cohort item 3 approved as exact duplicate: existing Mapo Tofu enriched with Aaron & Claire YouTube + creator page, Rýchle tag, and Mleté mäso concept."
    - "QA classification correction: Gochujang is now attached as a culinary condiment concept to all five pilot candidates where it is central; noodle/rice/potato main ingredients remain intact."
    - "docs/agent-contract-v1.md merged to main via PR #8."

sync:
