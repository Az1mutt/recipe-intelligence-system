schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "batch-ingestion-validation"

current_gate: >
  Complete review of the staged heterogeneous Hárok3 validation batch and prove
  that ingestion contract v1 behaves correctly across direct recipe pages,
  duplicate/enrichment cases, meaningful variants, non-recipe content, and
  partial-source fallback before any creator/channel-scale crawl.

current_state: >
  The live Supabase/PostgreSQL architecture has 33 public tables and currently
  contains 246 recipes, 141 sources, 191 recipe_inbox items, 14 recipe_candidates,
  17 recipe_inbox_evidence rows, and 52 culinary concepts. Five of the six staged
  Hárok3 validation sources are now dispositioned. Perfect Pot Roast enriched an
  exact existing duplicate; the cheesecake water-bath article correctly produced
  zero recipe candidates; Japanese-Style Mapo Tofu was preserved as a meaningful
  Japanese variant; Creamy Spinach and Mushroom Gnocchi was promoted as a unique
  recipe; and Creamy Sausage Gnocchi was promoted with Bravčové mäso as protein,
  Gnocchi as main_ingredient, and Italian Sausage as a specific ingredient
  culinary concept for ingredient-driven retrieval. The latter establishes the
  broader modeling principle that concrete ingredients such as Italian sausage
  or guanciale belong in recipe_concepts rather than overloading recipe tags or
  the coarse protein dimension. The remaining staged source is the Tasty YouTube
  item, which remains truthfully partial and uses external_reference fallback
  evidence. Supabase Security Advisor remains clean from the latest verified
  check. Repository documentation outside Project State is still materially
  stale and will be refreshed when this batch gate closes.

exact_next_action: >
  Review the final staged candidate, One-Pot Pasta Primavera, and decide whether
  it should merge into the existing Pasta primavera recipe or remain a distinct
  recipe/variant. Preserve the partial-source and external_reference provenance
  semantics. Then close the six-source batch, review batch-level failure patterns,
  update stable technical documentation, and decide readiness for creator-scale
  crawling.

blockers:
  - "No current technical blocker in Supabase."
  - >
      Direct YouTube fetch is not consistently reliable, but this is a known
      resolver constraint rather than a blocker because source_content,
      creator_reference, and external_reference fallback semantics are working.
  - >
      Broad creator/channel crawling is intentionally gated until the current
      representative batch is fully reviewed and closed.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      High-quality classification depends on legitimately accessible source
      metadata/content, creator-written references, or trustworthy external
      references. Access failures must remain explicit rather than being filled
      with invented content.

important_open_loops:
  - "Finish review of One-Pot Pasta Primavera, the final candidate in the current six-source batch."
  - "Evaluate batch-level failure modes and decide readiness for creator/channel-scale crawling."
  - >
      Decide whether a normalized Creator entity is warranted after repeated
      channel processing; shared-video provenance already works through the
      common source relation.
  - >
      Codify protein vs main_ingredient semantics, Mleté mäso usage, and specific
      ingredient concepts such as Italian Sausage in technical/agent documentation
      when the current batch gate closes.
  - >
      Treat prep_time, cook_time, servings and similar fields as optional
      enrichment populated only when reliably supported by evidence.
  - "Refresh README/schema/current-state documentation after the batch-ingestion gate."
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after ingestion robustness is proven."

portfolio:
  milestone: true
  signal: >
    The project now demonstrates not only happy-path ingestion but real batch
    behavior: duplicate enrichment, meaningful variant preservation, non-recipe
    rejection, external-reference fallback with provenance separation, practical
    taxonomy evolution, and ingredient-level retrieval through the knowledge graph
    without polluting coarse recipe taxonomies.

stale_or_unknown:
  - >
      README and broader schema/current-state documentation are stale relative
      to the live 33-table architecture and ingestion-contract implementation.
  - >
      Creator-layer normalization remains intentionally undecided pending more
      real batch/channel evidence.

verification:
  last_verified: "2026-09-10"
  sources:
    - "Live Supabase verification: 246 recipes, 141 sources, 14 candidates, 17 evidence rows, 52 culinary concepts."
    - "Creamy Sausage Gnocchi promoted as unique with Italian Sausage ingredient concept; source and inbox completed."
    - "Current six-source Hárok3 batch: 5 sources dispositioned, 1 staged recipe candidate remains in explicit review."
    - "Tasty YouTube fallback remains partial with external_reference evidence role."

sync:
  status: "synced"
  storage: ".project/workstreams/data-platform-architecture.yaml"
