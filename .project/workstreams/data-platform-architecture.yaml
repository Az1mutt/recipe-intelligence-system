schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "creator-scale-ingestion-pilot"

current_gate: >
  Validate Agent Contract v1 against a bounded Aaron & Claire creator/channel
  cohort. Discovery, Resolver, Classification, and QA/Review have completed for
  the first 10-video cohort. Explicit human review and deterministic promotion
  are now in progress, after which the pilot must stop for an agent-readiness audit.

current_state: >
  Supabase is ACTIVE_HEALTHY. The Aaron & Claire Agent Contract v1 pilot contains
  10 sources: one previously verified Ssamjang control plus nine new explicit-review
  YouTube sources. Resolver evidence is auditable for all nine new sources: eight
  are resolved through source content plus creator-owned references, while the
  2024 Gochujang Noodles source remains truthfully partial. Classification produced
  25 new candidates and human review is progressing video by video. Cohort item 2
  promoted Ground Beef Bulgogi and Spicy Ground Pork Bulgogi. Cohort item 3
  enriched existing Mapo Tofu as an exact duplicate. In cohort item 4, Miso Ramen
  was deliberately placed on hold for a dedicated ramen-domain review, while
  Teriyaki Chicken, Oyakodon, and Chicken Katsudon enriched existing recipes and
  Yaki Udon plus Chicken Katsu were promoted as new recipes. Oyakodon and Katsudon
  had legacy main_ingredient=Ryža cleared because rice is an integrated base, not
  a defining ingredient. New culinary concepts Vajcia and Panko were created.
  Ingredient identity is concept-first: new ingestion should normally identify
  1-3 primary key ingredient concepts, while recipes.main_ingredient_id remains
  legacy compatibility. Protein and key concepts may overlap by recipe role; e.g.
  Oyakodon keeps protein=Kuracie mäso and uses Vajcia as a primary concept, while
  egg-led dishes may use protein=Vajcia. A direct user-submitted SAMUKICHI mushroom
  video was ingested outside the creator pilot under auto_after_validation and
  promoted as Water-First Golden Brown Mushrooms, exposing the source-intent nuance
  between recipe extraction and technique-teaching content. Cohort item 5 completed
  the three Kimchi Fried Rice variants and cohort item 6 completed six Fire Noodles
  recipe hacks linked through a shared Korean Fire Noodles component concept.
  Cohort item 8 completed Teriyaki Chicken One Pot Rice as a unique one-pot rice
  identity with Japonská cuisine, Kuracie mäso protein, 4 servings, one-pot tag,
  and primary Teriyaki Sauce concept. A Facebook Reel direct submission that was
  initially blocked by source access was later resolved from user-supplied source
  text and promoted as Bulgur Meatball Noodle Soup. The source is now resolved and
  completed with manual_context evidence. Because the source only says minced meat,
  protein and cuisine remain NULL rather than guessed; Mleté mäso, Bulgur, and
  Vermicelli are primary recipe concepts. Fresh live counts are 263 recipes,
  161 sources, 202 inbox items, 41 candidates, 43 evidence rows, and 67 culinary
  concepts. Pilot candidate statuses remain 14 promoted, 4 duplicate, and
  7 needs_review.

exact_next_action: >
  Continue explicit review with cohort item 9, the four-recipe Gochujang Pt.2
  source: Gamja Jorim (Spicy Braised Potatoes), Gochujang Fried Rice, Gochujang
  Stir-Fried Noodles, and Gochujang Chicken Rice Bowl. Re-evaluate them under the
  concept-first ingredient model, especially Gochujang as a primary condiment
  concept and the distinction between defining ingredient versus provisional
  rice/noodle base. Keep Miso Ramen and the partial 2024 Gochujang Noodles
  candidate on hold.

blockers:
  - "No current Supabase availability or architecture blocker."
  - >
      The 2024 Gochujang Noodles source is intentionally partial and may overlap
      the resolved 2022 Gochujang Stir-Fried Noodles recipe. It must not be
      promoted until identity is resolved or explicitly held.
  - >
      Remaining creator/channel candidates still require explicit human review
      before deterministic promotion.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      Creator-scale quality depends on legitimately accessible metadata/content,
      creator-written references, trustworthy external references, or explicit
      manual user context. Failed or partial acquisition must remain explicit and
      must never be replaced with invented source content.
  - project: "Project OS / Agent Architecture"
    workstream: "Cross-project agent platform"
    dependency: >
      Recipe Intelligence owns the domain-specific Agent Contract. Project OS/Core
      may later decide how these roles are hosted, scheduled, observed, and reused
      across projects; that platform decision is not required for this supervised
      pilot.

important_open_loops:
  - "Complete explicit review of the remaining 7 Aaron & Claire pilot candidates."
  - >
      Capture the SAMUKICHI source-intent finding in the post-pilot contract audit:
      distinguish what a source primarily does (recipe, multi_recipe, technique_demo,
      ingredient_explainer, learning content) from recipe extraction. Evaluate a
      future source-to-concept relationship such as teaches/demonstrates separately
      from recipe_concepts uses-technique links.
  - >
      Post-pilot, decide whether provisional base_component should become a
      first-class lookup/column or be represented through culinary concepts.
  - >
      Audit historical main_ingredient values under the new concept-first model
      and migrate selectively into primary recipe_concepts where useful; do not
      bulk-clear or rewrite the legacy field without recipe-level review.
  - >
      Audit historical main_ingredient assignments that currently use Ryža (18),
      Rezance (19), or Zemiaky (8). Do not blanket-migrate them: some potato-led
      dishes may legitimately keep Zemiaky as main_ingredient, while integrated
      rice/noodle bases should be reclassified.
  - >
      Treat ramen as a dedicated future domain review. Use the user-designated
      Lord Ramen book as the planned primary reference and supplement it with
      additional authentic sources before locking ramen-specific taxonomy.
  - "Run deterministic Promotion Executor only for approved dispositions."
  - "Resolve or hold the 2024 Gochujang Noodles identity safely."
  - "Perform post-pilot Agent Contract v1 audit before expanding the channel crawl."
  - >
      Measure which roles proved mechanical vs which required strong reasoning or
      human review, including partial-source and manual-context recovery cases.
  - >
      Decide whether a normalized Creator entity is warranted after this pilot;
      current source/content-collection provenance remains sufficient so far.
  - >
      Decide whether culinary-concept creation can later be delegated safely or
      should remain explicit-review during early agent operation.
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after creator-scale ingestion behavior is proven."

portfolio:
  milestone: true
  signal: >
    Recipe Intelligence has now exercised all five conceptual roles of Agent
    Contract v1 in a real creator-scale cohort and has also demonstrated recovery
    of an inaccessible social source through explicit manual_context evidence.
    The system preserved provenance, refused to guess inaccessible content, then
    resumed deterministically once the user supplied the source text. The remaining
    proof point is completion of reviewed pilot dispositions followed by the
    post-pilot audit.

stale_or_unknown:
  - >
      Creator-layer normalization remains intentionally undecided pending the
      post-pilot audit.
  - >
      The concrete runtime/orchestration technology for autonomous agents is not
      selected or implemented; Agent Contract v1 is the domain behavior contract,
      not the deployment architecture.
  - >
      Exact identity of the 2024 Gochujang Noodles source remains unresolved.

