schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "agent-readiness-audit"

current_gate: >
  Agent Contract v1.1 is approved and merged as the guarded-autonomy implementation
  specification. The post-pilot semantic and authority decisions are now documented:
  structural bases use recipe_concepts role=main_component rather than a new column;
  source intent remains in recipe_inbox.structured_data; Classification may propose
  culinary concepts and strong QA may approve straightforward evidence-backed ones;
  controlled taxonomy/model novelty remains specialist-owned; promotion authority
  follows review_policy. The next gate is implementation design for Resolver Service
  v1 and the deterministic Promotion Executor contract.

current_state: >
  Supabase is ACTIVE_HEALTHY. The Aaron & Claire Agent Contract v1 pilot contains
  10 sources: one previously verified Ssamjang control plus nine new explicit-review
  YouTube sources. Resolver evidence is auditable for all nine new sources: eight
  are resolved through source content plus creator-owned references, while the
  2024 Gochujang Noodles source remains truthfully partial. Classification produced
  25 new candidates and human review is progressing video by video. Cohort item 2
  promoted Ground Beef Bulgogi and Spicy Ground Pork Bulgogi. Cohort item 3 enriched
  existing Mapo Tofu as an exact duplicate. In cohort item 4, Miso Ramen was placed
  on hold for a dedicated ramen-domain review; Teriyaki Chicken, Oyakodon, and
  Chicken Katsudon enriched existing recipes; Yaki Udon and Chicken Katsu were
  promoted. Cohort item 5 promoted three Kimchi recipes, cohort item 6 promoted six
  Fire Noodles recipe hacks linked through the shared Korean Fire Noodles concept,
  and cohort item 8 promoted Teriyaki Chicken One Pot Rice as a unique one-pot dish.
  Ingredient identity remains concept-first: new ingestion should normally identify
  1-3 primary key ingredient concepts while recipes.main_ingredient_id remains
  legacy compatibility. Protein and key concepts may overlap according to recipe role.
  Outside the pilot, the direct SAMUKICHI submission proved technique-first source
  nuance, and a Facebook Reel initially blocked by access was later resolved from
  explicit manual_context and promoted as Bulgur Meatball Noodle Soup without
  guessing cuisine or meat species. Firecrawl has now been validated in the
  supervised Resolver path for generic creator web pages: the direct Aaron & Claire
  Garlic Butter Rice URL was fetched as structured source evidence, deduplicated,
  classified, and auto-promoted after validation. Garlic Butter Rice is stored as
  Príloha / Varené with provisional base_component=Ryža, primary Garlic and Butter
  concepts, 6 servings, 10-minute prep, 30-minute cook, and Vhodné na mrazenie tag.
  Its source label "Asian" was not forced into cuisine because no matching controlled
  cuisine exists. New Garlic concept was created. Firecrawl is not yet an autonomous
  agent backend or deployed Resolver service; only the supervised acquisition path
  is verified. Cohort item 9 is now complete: Firecrawl upgraded the creator-page
  evidence for the four-recipe Gochujang Pt.2 source, and all four recipes were
  explicitly approved and promoted. Gamja Jorim uses primary Zemiaky + Gochujang
  concepts with no new legacy main_ingredient; Gochujang Fried Rice uses default
  Hovädzie mäso plus primary Gochujang + Mleté mäso; Gochujang Stir-Fried Noodles
  uses default Bravčové mäso with Udon as provisional base and primary Gochujang +
  Mleté mäso; Gochujang Chicken Rice Bowl uses Kuracie mäso and primary Gochujang.
  New Zemiaky concept was created. Cohort item 10 is now complete as well:
  Firecrawl re-resolved the creator page and exposed that the exact source is a
  Jaengban Jjajang variant rather than a generic baseline Jjajangmyeon. After
  explicit approval it was promoted as Jaengban Jjajang (Jjajangmyeon), with
  Kórejská cuisine, Bravčové mäso protein, Wok preparation, 2 servings, 15-minute
  prep, 20-minute cook, primary Chunjang concept, secondary Morské plody concept,
  and preference_status=adaptable because seafood is present in the full version
  but the creator explicitly supports a simpler core without the extra ingredients.
  New Chunjang and Morské plody concepts were created. All clean pilot candidates
  are now dispositioned. Fresh live counts are 269 recipes, 166 sources, 203 inbox
  items, 42 candidates, 44 evidence rows, and 71 culinary concepts. Pilot candidate
  statuses are 19 promoted, 4 duplicate, and 2 needs_review; the two remaining
  needs_review rows are the intentional Miso Ramen and 2024 Gochujang Noodles holds.

exact_next_action: >
  Define Resolver Service v1 as an implementable domain interface: request/response
  contract, adapter selection rules, evidence normalization, idempotency, retry and
  caching behavior, provider/credential boundaries, Firecrawl generic-web adapter,
  YouTube/source-specific adapter expectations, social/manual fallbacks, and failure
  semantics. In parallel, define the deterministic Promotion Executor input,
  preconditions, transaction boundary, approved-disposition versioning, and
  post-write verification. Do not implement autonomous runtime/orchestration yet.

blockers:
  - "No current Supabase availability or architecture blocker."
  - >
      The 2024 Gochujang Noodles source is intentionally partial and may overlap
      the resolved 2022 Gochujang Stir-Fried Noodles recipe. It must not be
      promoted until identity is resolved or explicitly held.
  - >
      Two creator candidates remain deliberately held: Miso Ramen requires a
      dedicated ramen-domain review, and the partial 2024 Gochujang Noodles source
      requires identity resolution against the now-promoted 2022 recipe. These
      holds do not block the Agent Contract readiness audit.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      Creator-scale quality depends on legitimately accessible metadata/content,
      creator-written references, trustworthy external references, explicit manual
      user context, or a generic web acquisition tool such as Firecrawl. Firecrawl
      is verified for supervised creator-page acquisition but is not yet wired into
      an autonomous Resolver service. Failed or partial acquisition must remain
      explicit and must never be replaced with invented source content.
  - project: "Project OS / Agent Architecture"
    workstream: "Cross-project agent platform"
    dependency: >
      Recipe Intelligence owns the domain-specific Agent Contract. Project OS/Core
      may later decide how these roles are hosted, scheduled, observed, and reused
      across projects; that platform decision is not required for this supervised
      pilot.

important_open_loops:
  - "Carry the two intentional pilot holds explicitly into the audit: Miso Ramen and the partial 2024 Gochujang Noodles candidate."
  - >
      Capture the SAMUKICHI source-intent finding in the post-pilot contract audit:
      distinguish what a source primarily does (recipe, multi_recipe, technique_demo,
      ingredient_explainer, learning content) from recipe extraction. Evaluate a
      future source-to-concept relationship such as teaches/demonstrates separately
      from recipe_concepts uses-technique links.
  - >
      Define the future Resolver Service/tool boundary so autonomous agents call a
      narrow resolve_source interface while Firecrawl remains an infrastructure
      backend rather than a broadly exposed agent credential/tool.
  - >
      Post-pilot, decide whether provisional base_component should become a
      first-class lookup/column or be represented through culinary concepts.
  - >
      Audit historical main_ingredient values under the new concept-first model
      and migrate selectively into primary recipe_concepts where useful; do not
      bulk-clear or rewrite the legacy field without recipe-level review.
  - >
      Audit historical main_ingredient assignments that currently use Ryža (18),
      Rezance (19), or Zemiaky (8). Do not blanket-migrate them: some potato-led
      dishes may legitimately keep Zemiaky as main_ingredient, while integrated
      rice/noodle bases should be reclassified.
  - >
      Treat ramen as a dedicated future domain review. Use the user-designated
      Lord Ramen book as the planned primary reference and supplement it with
      additional authentic sources before locking ramen-specific taxonomy.
  - "Run deterministic Promotion Executor only for approved dispositions."
  - "Resolve or hold the 2024 Gochujang Noodles identity safely."
  - "Implement the approved Agent Contract v1.1 boundaries before expanding the channel crawl."
  - >
      Measure which roles proved mechanical vs which required strong reasoning or
      human review, including partial-source, manual-context, and Firecrawl-resolved cases.
  - >
      Decide whether a normalized Creator entity is warranted after this pilot;
      current source/content-collection provenance remains sufficient so far.
  - >
      Decide whether culinary-concept creation can later be delegated safely or
      should remain explicit-review during early agent operation.
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after creator-scale ingestion behavior is proven."

portfolio:
  milestone: true
  signal: >
    Agent Contract v1.1 is now approved and merged as the implementation
    specification for guarded autonomy. Live invariants show no duplicate inbox
    source identities, no duplicate candidate keys, no promoted candidate without a
    recipe/source link, no partial source without an explicit error, no
    possible_duplicate or validation-needs-review candidate promoted, and no
    duplicate disposition without a matched recipe. The authoritative docs now
    encode the Resolver Service boundary, concept-approval authority, main_component
    modeling, source-intent policy, and review-policy-based promotion authority.
    The next value step is implementation design for Resolver Service v1 and the
    deterministic Promotion Executor, not another manual creator batch.

stale_or_unknown:
  - >
      Creator-layer normalization remains intentionally undecided pending the
      post-pilot audit.
  - >
      The concrete runtime/orchestration technology for autonomous agents is not
      selected or implemented; Agent Contract v1 is the domain behavior contract,
      not the deployment architecture.
  - >
      Firecrawl is connected and verified in the supervised ChatGPT workflow, but
      its future autonomous deployment/API hosting, credential storage, budgeting,
      and rate-limit policy are not yet implemented.
  - >
      Exact identity of the 2024 Gochujang Noodles source remains unresolved.

