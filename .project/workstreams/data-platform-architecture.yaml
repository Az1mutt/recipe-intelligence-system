schema_version: "0.2"

state_scope: "workstream"

project:
  name: "Recipe Intelligence System"
  workstream: "Data & Platform Architecture"
  owner: "Recipe Intelligence technical specialist chat"

status: "active"
phase: "creator-scale-ingestion-pilot"

current_gate: >
  Validate Agent Contract v1 against a bounded Aaron & Claire creator/channel
  cohort. Discovery, Resolver, Classification, and QA/Review have completed for
  the first 10-video cohort. Explicit human review and deterministic promotion
  are now in progress, after which the pilot must stop for an agent-readiness audit.

current_state: >
  Supabase is ACTIVE_HEALTHY. The Aaron & Claire Agent Contract v1 pilot contains
  10 sources: one previously verified Ssamjang control plus nine new explicit-review
  YouTube sources. Resolver evidence is auditable for all nine new sources: eight
  are resolved through source content plus creator-owned references, while the
  2024 Gochujang Noodles source remains truthfully partial because its exact
  creator page was not independently verified. Classification produced 25 new
  candidates and QA proposed 20 unique/meaningful variants, 4 exact-duplicate
  enrichments, and 1 possible duplicate/hold. Human review has begun. Cohort item 2
  was approved and deterministically promoted: Ground Beef Bulgogi and Spicy Ground
  Pork Bulgogi now exist as separate recipes, each linked to the original YouTube
  video plus its creator-owned written recipe page. Both retain concrete beef/pork
  protein categories and use Mleté mäso as a culinary concept. Live counts after
  this promotion are 248 recipes, 145 sources, 200 inbox items, 39 candidates,
  40 evidence rows, and 52 culinary concepts.

exact_next_action: >
  Continue explicit review with cohort item 4, the six-recipe Japanese Dinners
  video. Review Miso Ramen, Teriyaki Chicken, Yaki Udon, Oyakodon, Chicken Katsu,
  and Chicken Katsudon against their current QA dispositions before deterministic
  promotion/enrichment. Keep the 2024 Gochujang Noodles candidate on hold until
  its identity versus the resolved 2022 Gochujang Stir-Fried Noodles candidate
  is clarified.

blockers:
  - "No current Supabase availability or architecture blocker."
  - >
      The 2024 Gochujang Noodles source is intentionally partial and may overlap
      the resolved 2022 Gochujang Stir-Fried Noodles recipe. It must not be
      promoted until identity is resolved or explicitly held.
  - >
      Remaining creator/channel candidates still require explicit human review
      before deterministic promotion.

dependencies:
  - project: "External source ecosystem"
    workstream: "Resolver inputs"
    dependency: >
      Creator-scale quality depends on legitimately accessible metadata/content,
      creator-written references, or trustworthy external references. Failed or
      partial acquisition must remain explicit and must never be replaced with
      invented source content.
  - project: "Project OS / Agent Architecture"
    workstream: "Cross-project agent platform"
    dependency: >
      Recipe Intelligence owns the domain-specific Agent Contract. Project OS/Core
      may later decide how these roles are hosted, scheduled, observed, and reused
      across projects; that platform decision is not required for this supervised
      pilot.

important_open_loops:
  - "Complete explicit review of the remaining 22 Aaron & Claire pilot candidates."
  - "Run deterministic Promotion Executor only for approved dispositions."
  - "Resolve or hold the 2024 Gochujang Noodles identity safely."
  - "Perform post-pilot Agent Contract v1 audit before expanding the channel crawl."
  - >
      Measure which roles proved mechanical vs which required strong reasoning or
      human review, including the partial-source Gochujang case.
  - >
      Decide whether a normalized Creator entity is warranted after this pilot;
      current source/content-collection provenance remains sufficient so far.
  - >
      Decide whether culinary-concept creation can later be delegated safely or
      should remain explicit-review during early agent operation.
  - "Review remaining social inbox items later."
  - "Recover unresolved Facebook saves where possible."
  - "Import and deduplicate Hárok5 later."
  - "Implement pantry/inventory later using culinary_concepts as the reference layer."
  - "Build frontend/review UI only after creator-scale ingestion behavior is proven."

portfolio:
  milestone: true
  signal: >
    Recipe Intelligence has now exercised all five conceptual roles of Agent
    Contract v1 in a real creator-scale cohort, including the first deterministic
    Promotion Executor run after explicit human approval. The system preserved
    evidence provenance, kept one ambiguous source on hold, and promoted two
    meaningful variants with narrow, auditable writes. The remaining proof point
    is completion of reviewed dispositions followed by the post-pilot audit.

stale_or_unknown:
  - >
      Creator-layer normalization remains intentionally undecided pending the
      post-pilot audit.
  - >
      The concrete runtime/orchestration technology for autonomous agents is not
      selected or implemented; Agent Contract v1 is the domain behavior contract,
      not the deployment architecture.
  - >
      Exact identity of the 2024 Gochujang Noodles source remains unresolved.

