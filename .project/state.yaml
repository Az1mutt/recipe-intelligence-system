schema_version: "0.2"

state_scope: "project_rollup"

project:
  name: "Recipe Intelligence System"
  owner: "Project OS rollup"

status: "active"
phase: "multi-workstream-ingestion-and-intelligence-development"

current_gate: >
  Keep the technical ingestion architecture progressing through batch validation
  while initializing the Product & Intelligence workstream as a separate source
  of truth for agent behavior, recommendation/learning logic and product policy.

current_state: >
  Recipe Intelligence now operates as a multi-workstream project. Data &
  Platform Architecture owns Supabase/PostgreSQL, ingestion contracts, resolver/
  evidence/candidate flows, security and technical implementation. Product &
  Intelligence owns what the system should do: recommendation and learning
  behavior, agent roles, review/promotion semantics, preference meaning and
  human-in-the-loop workflows. The technical workstream is current and verified;
  the Product & Intelligence workstream has a dedicated state file but still
  requires its first authoritative specialist synchronization.

exact_next_action: >
  Continue the technical 5-10 URL batch validation and, independently, have the
  Product & Intelligence specialist chat perform its first state sync. After
  both workstreams are current, regenerate this project rollup from both states.

blockers:
  - "Product & Intelligence workstream state has not yet been initialized by its specialist owner."

workstreams:
  - id: "data-platform-architecture"
    path: ".project/workstreams/data-platform-architecture.yaml"
    owner: "Recipe Intelligence technical specialist chat"
  - id: "product-intelligence"
    path: ".project/workstreams/product-intelligence.yaml"
    owner: "Cooking OS - Product & Intelligence Lab specialist chat"

rollup_policy:
  specialist_writes_root: false
  generated_from:
    - ".project/workstreams/data-platform-architecture.yaml"
    - ".project/workstreams/product-intelligence.yaml"

portfolio:
  milestone: true
  signal: >
    The project now has both a proven technical ingestion foundation and a
    cleaner operating boundary between platform implementation and product/
    agent intelligence, reducing the risk of schema design and agent behavior
    becoming entangled.

verification:
  last_verified: "2026-09-09"
  sources:
    - ".project/workstreams/data-platform-architecture.yaml"
    - ".project/workstreams/product-intelligence.yaml"

sync:
  status: "synced"
  storage: ".project/state.yaml"
