schema_version: "0.2"

state_scope: "project_rollup"

project:
  name: "Recipe Intelligence System"
  owner: "Project OS rollup"

status: "active"
phase: "batch-ingestion-validation"

current_gate: >
  Prove that the technical ingestion contract remains reliable across a small
  heterogeneous batch of real backlog URLs before any creator/channel-scale crawl.

current_state: >
  Recipe Intelligence currently has one active specialist-owned workstream:
  Data & Platform Architecture. It owns Supabase/PostgreSQL, schema, ingestion
  contracts, resolver/evidence/candidate flows, security and technical
  implementation. A separate Product & Intelligence boundary is reserved for
  future use if/when a dedicated specialist chat or agent-product design
  workstream actually exists, but it is not an active dependency or blocker.
  The manual recipes chat is currently a user/curation workflow, not a Project
  State owner.

exact_next_action: >
  Continue the technical 5-10 URL batch validation in Data & Platform
  Architecture. Do not initialize a separate Product & Intelligence workstream
  until there is a real owner and meaningful ongoing work for it.

blockers: []

workstreams:
  - id: "data-platform-architecture"
    path: ".project/workstreams/data-platform-architecture.yaml"
    owner: "Recipe Intelligence technical specialist chat"
    status: "active"
  - id: "product-intelligence"
    path: ".project/workstreams/product-intelligence.yaml"
    owner: "unassigned"
    status: "future_unassigned"

rollup_policy:
  specialist_writes_root: false
  generated_from:
    - ".project/workstreams/data-platform-architecture.yaml"
  future_workstreams_do_not_block_rollup: true

portfolio:
  milestone: true
  signal: >
    The project has a proven technical ingestion foundation and a clean future
    boundary for product/agent-intelligence work without forcing a second active
    workstream before it exists in practice.

verification:
  last_verified: "2026-09-09"
  sources:
    - ".project/workstreams/data-platform-architecture.yaml"
    - "Project OS clarification: no dedicated Product & Intelligence specialist chat currently exists."

sync:
  status: "synced"
  storage: ".project/state.yaml"
